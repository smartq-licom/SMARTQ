# SmartQ behind nginx. setup.sh fills in __DOMAIN__; certbot then adds HTTPS.
server {
    listen 80;
    server_name __DOMAIN__;

    # priority proofs and representative letters are uploaded (photos, PDFs)
    client_max_body_size 10m;

    # Real-time updates (Server-Sent Events): never buffered, kept open long
    location /live/events {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
